## Files preserved across a config-keeping sysupgrade (`just flash <ip> keep`),
## in addition to /etc/config. Per-device identity MUST survive a re-flash so the
## unit stays on WiFi + mesh and remains reachable (no ethernet rescue).
## NOTE: a clean flash (`just flash <ip> clean`, sysupgrade -n) ignores this list.
/etc/glrobot.conf
/etc/glrobot.mode
